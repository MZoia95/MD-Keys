name: Build MDKeys Firmware

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MDKeys repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install QMK CLI
        run: pip install qmk

      - name: Install QMK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Set up QMK home
        run: qmk setup -H ${{ github.workspace }} -y

      - name: Build MDKeys firmware
        run: qmk compile -kb mfkeys -km default

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: mdkeys-firmware
          path: mfkeys_default.uf2
          retention-days: 90
